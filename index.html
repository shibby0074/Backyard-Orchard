<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#edf6e8"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.svg"><title>My Backyard Orchard</title>
<style>*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;background:#f4f6f1;color:#172117;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}main{max-width:1300px;margin:auto;padding:8px max(8px,env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}.top{display:flex;justify-content:space-between;align-items:end;gap:8px;flex-wrap:wrap}h1{font-size:19px;margin:2px 0}.muted{font-size:11px;color:#647064;margin:2px 0}.saved{font-size:11px;color:#2f6f43;font-weight:700}.toolbar{display:flex;gap:4px;flex-wrap:wrap;margin:7px 0}button{min-height:40px;border:1px solid #bdc8ba;background:white;border-radius:8px;padding:6px 9px;color:#172117;font-weight:600}button.on{background:#e3efe5;border-color:#7ca287}button:disabled{opacity:.45}.layout{display:grid;grid-template-columns:minmax(0,1fr) 285px;gap:8px;align-items:start}.stage{background:white;border:1px solid #c8d1c5;border-radius:9px;padding:3px;min-width:0;overflow:hidden}svg{display:block;width:100%;height:auto;touch-action:none;-webkit-user-select:none;user-select:none}.panel{background:white;border:1px solid #c8d1c5;border-radius:9px;padding:9px}.panel h2{font-size:15px;margin:0 0 5px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:5px 7px}label{font-size:10px;color:#647064;display:block}input,select,textarea{width:100%;font-size:16px;padding:7px;border:1px solid #c8d1c5;border-radius:7px;background:white}textarea{min-height:58px;resize:vertical}.wide{grid-column:1/-1}.canopy{fill-opacity:.15;stroke-width:.11;pointer-events:none}.marker{stroke:white;stroke-width:.17}.selected .marker{stroke:#111;stroke-width:.3}.label{font-size:.68px;font-weight:600;paint-order:stroke;stroke:white;stroke-width:.23px;pointer-events:none}.axis{font-size:.52px;fill:#475347}.fixed{font-size:.62px;fill:#4f5d4f}.list{margin-top:8px;background:white;border:1px solid #c8d1c5;border-radius:9px;padding:7px}.list h3{font-size:13px;margin:0 0 5px}#plantList{display:flex;gap:4px;flex-wrap:wrap}#plantList button{min-height:34px;font-size:11px;padding:4px 7px}.actions{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}@media(max-width:720px){.layout{display:block}.panel{margin-top:7px}.label{font-size:.76px}h1{font-size:17px}}@media(orientation:landscape) and (max-height:520px){main{max-width:none;padding:4px 7px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 250px}.panel{margin:0}button{min-height:34px;font-size:11px}.toolbar{margin:3px 0}}
</style></head><body><main><div class="top"><div><h1>My Backyard Orchard</h1><p class="muted">Actual master layout • 56 × 42 ft • auto-saved working table</p></div><div id="saved" class="saved">Ready</div></div>
<div class="toolbar"><button data-layer="current" class="layer on">Current</button><button data-layer="y1" class="layer">+1 Year</button><button data-layer="y2" class="layer">+2 Years</button><button data-layer="y3" class="layer">+3 Years</button><button id="labels" class="on">Labels</button><button id="gridBtn" class="on">Grid</button><button id="add">+ Plant</button><button id="df">+ DF Trellis</button><button id="undo">Undo</button><button id="redo">Redo</button></div>
<div class="layout"><div class="stage"><svg id="yard" viewBox="-3 -3 62 50" preserveAspectRatio="xMidYMid meet"><defs><pattern id="g1" width="1" height="1" patternUnits="userSpaceOnUse"><path d="M1 0H0V1" fill="none" stroke="#ccd5c8" stroke-width=".04"/></pattern><pattern id="g5" width="5" height="5" patternUnits="userSpaceOnUse"><path d="M5 0H0V5" fill="none" stroke="#748272" stroke-width=".12"/></pattern></defs><rect width="56" height="42" fill="#edf6e8" stroke="#111" stroke-width=".22"/><g id="grid"><rect width="56" height="42" fill="url(#g1)"/><rect width="56" height="42" fill="url(#g5)"/><g class="axis" id="axis"></g></g><rect width="10" height="15" fill="#dcecf7" fill-opacity=".7" stroke="#316c9c" stroke-width=".18"/><text x="5" y="7" text-anchor="middle" class="fixed">DRAGON FRUIT VALLEY</text><text x="5" y="7.8" text-anchor="middle" class="fixed">10 × 15 ft</text><rect x="30" y="30" width="22" height="12" fill="#d4d4d4" stroke="#555" stroke-width=".18"/><text x="41" y="36" text-anchor="middle" class="fixed">CONCRETE SLAB 22 × 12 ft</text><rect x="19" y="43" width="37" height="2" fill="#efe0cc" stroke="#8b4938" stroke-width=".16"/><text x="37.5" y="44.3" text-anchor="middle" class="fixed">HOUSE — 37 ft</text><g id="canopies"></g><g id="plants"></g></svg></div>
<aside class="panel"><h2 id="head">Select a plant</h2><div class="fields"><div class="wide"><label>Name</label><input id="nm" disabled></div><div><label>Category</label><select id="cat" disabled><option value="planted">Green — planted</option><option value="pending">Orange — not in ground</option><option value="purchase">Red — needs purchase</option><option value="blue">Blue — custom</option><option value="purple">Purple — custom</option></select></div><div><label>Position</label><select id="lock" disabled><option value="no">Unlocked</option><option value="yes">Locked</option></select></div><div><label>X ft</label><input id="xx" type="number" step="1" disabled></div><div><label>Y ft</label><input id="yy" type="number" step="1" disabled></div><div><label>Current canopy ft</label><input id="cc" type="number" step=".5" disabled></div><div><label>1-year canopy ft</label><input id="c1" type="number" step=".5" disabled></div><div><label>2-year canopy ft</label><input id="c2" type="number" step=".5" disabled></div><div><label>3-year canopy ft</label><input id="c3" type="number" step=".5" disabled></div><div class="wide"><label>Notes</label><textarea id="notes" disabled></textarea></div></div><div class="actions"><button id="dup" disabled>Duplicate</button><button id="del" disabled>Delete</button><button id="export">Export backup</button><button id="importBtn">Import backup</button><input id="importFile" type="file" accept="application/json,.json" hidden><button id="reset">Reset master</button></div><p id="msg" class="muted">Changes save automatically on this device. Export a backup for safekeeping or moving between devices.</p></aside></div><section class="list"><h3>Plant list</h3><div id="plantList"></div></section>
<script src="app.js"></script></main></body></html>
